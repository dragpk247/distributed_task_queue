version: '3.8'

services:
  # Primary Master Node
  master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dtq-master
    command:
      - "--bind"
      - "0.0.0.0:6379"
      - "--aof"
      - "/data/master_persistence.aof"
      - "--requirepass"
      - "supersecretpass"
      - "--http-bind"
      - "0.0.0.0:9090"
    ports:
      - "6379:6379"
      - "9090:9090"
    volumes:
      - master-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6379 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Follower Replica Node replicating live from Master
  replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dtq-replica
    command:
      - "--bind"
      - "0.0.0.0:6379"
      - "--aof"
      - "/data/replica_persistence.aof"
      - "--replicaof"
      - "master:6379"
      - "--masterauth"
      - "supersecretpass"
    ports:
      - "6380:6379"
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - replica-data:/data
    restart: unless-stopped

volumes:
  master-data:
  replica-data:
