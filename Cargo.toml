[package]
name = "distributed_task_queue"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime & networking
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"

# Performance concurrency structures
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Utility
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
